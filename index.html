<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilişim ve Havacılık</title>
<style>
:root{--bg:#eef2f7;--bi:#0a6cff;--hv:#ffd000;--gv:#1fbf75;--ink:#0f1b2d;--ink2:#3a4a60;--panel:#ffffff;--menu:#ffffff;--code:#0c1424;--codeTx:#cfe2ff;--line:color-mix(in srgb,var(--ink) 12%,transparent);--bi2:color-mix(in srgb,var(--bi) 70%,#000);--hv2:color-mix(in srgb,var(--hv) 70%,#000)}
@property --ac{syntax:'<color>';inherits:true;initial-value:#0a6cff}
@property --ac2{syntax:'<color>';inherits:true;initial-value:#0a4fc4}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);cursor:none;user-select:none}
*{box-sizing:border-box}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  font-family:'Segoe UI','Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  --ac:var(--bi);--ac2:var(--bi2);transition:--ac 1.2s,--ac2 1.2s}
#stage[data-topic=havacilik]{--ac:var(--hv);--ac2:var(--hv2)}
#stage[data-topic=atolye]{--ac:var(--gv);--ac2:var(--bi)}
.vslide{display:block;padding:0;background:var(--code)}
.vslide video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--code)}
.vslide .top{z-index:3;text-shadow:0 2px 12px color-mix(in srgb,var(--ink) 80%,transparent)}
.vslide .vcap{position:absolute;left:0;right:0;bottom:0;padding:90px 110px 50px;font-size:56px;font-weight:800;color:var(--panel);background:linear-gradient(transparent,color-mix(in srgb,var(--ink) 75%,transparent))}
.bg{position:absolute;inset:0;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(120px);opacity:.2}
.bg .b1{width:900px;height:900px;left:-200px;top:-250px;background:var(--ac);animation:d1 40s ease-in-out infinite alternate}
.bg .b2{width:800px;height:800px;right:-200px;bottom:-300px;background:var(--ac2);animation:d2 52s ease-in-out infinite alternate}
.bg .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(15,27,45,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(15,27,45,.03) 1px,transparent 1px);background-size:80px 80px;animation:g 30s linear infinite}
@keyframes d1{to{transform:translate(300px,200px)}}
@keyframes d2{to{transform:translate(-300px,-160px)}}
@keyframes g{to{background-position:80px 80px}}
#slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;padding:150px 110px 120px;display:grid;grid-template-columns:1fr 780px;gap:60px;align-items:center}
.top{position:absolute;left:110px;right:110px;top:56px;display:flex;justify-content:space-between;align-items:center}
.tag{font-size:28px;font-weight:700;letter-spacing:.18em;color:var(--ink);padding:10px 26px;border:2px solid var(--ac);border-radius:40px;background:color-mix(in srgb,var(--ac) 18%,transparent)}
.cnt{font-size:28px;font-weight:600;letter-spacing:.12em;color:var(--ink2)}
h1{margin:0 0 24px;padding-bottom:.12em;font-size:100px;line-height:1.14;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,var(--ink) 35%,color-mix(in srgb,var(--ac) 75%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}
ul{list-style:none;margin:0;padding:0}
li{position:relative;font-size:36px;line-height:1.25;padding-left:44px;margin-bottom:16px;color:var(--ink2);opacity:0;transform:translateX(-40px)}
li::before{content:"";position:absolute;left:0;top:.5em;width:20px;height:20px;border-radius:6px;background:var(--ac)}
.live li{animation:li .8s cubic-bezier(.2,.8,.2,1) var(--d) forwards}
.live h1{animation:h .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes li{to{opacity:1;transform:none}}
@keyframes h{from{opacity:0;transform:translateY(40px)}}
.vis{width:780px;height:780px;border-radius:44px;background:var(--panel);border:2px solid color-mix(in srgb,var(--ac) 35%,transparent);padding:50px;box-shadow:0 30px 60px rgba(15,27,45,.1)}
#bg{position:absolute;left:0;top:0;width:1920px;height:1080px}
#stage.gl .bg i{display:none}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(15,27,45,.06) 100%)}
.vis.v3{background:color-mix(in srgb,var(--panel) 50%,transparent);box-shadow:none;padding:0}
.v3d{width:100%;height:100%;position:relative;overflow:hidden;border-radius:44px}
.lbl{position:absolute;left:0;top:0;font:700 21px 'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--panel);border-left:3px solid var(--ac);padding:3px 10px;white-space:nowrap;pointer-events:none;will-change:transform,opacity}
.lbl::before{content:"";position:absolute;right:100%;top:50%;width:30px;height:2px;background:var(--ac)}
.eyebrow{display:flex;align-items:center;gap:22px;margin-bottom:14px;font-size:28px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.eyebrow .dots{display:flex;gap:10px}
.eyebrow .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ac);opacity:.7}
.eyebrow .dots i.on{background:var(--ac);opacity:1}
.gs .st,.gt .gr,.gc .cd{border-left:6px solid var(--ac)}
.svg{width:100%;height:100%;overflow:visible}
.fun{position:absolute;left:110px;right:110px;bottom:34px;font-size:30px;color:var(--ink);background:var(--panel);border-left:6px solid var(--ac);border-radius:18px;padding:16px 28px;box-shadow:0 10px 30px rgba(15,27,45,.08)}
.fun b{color:color-mix(in srgb,var(--ac) 70%,var(--ink));letter-spacing:.14em;margin-right:14px}
#bar{position:absolute;left:0;bottom:0;height:8px;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));z-index:9}
@keyframes fill{to{width:100%}}
#sweep{position:absolute;top:0;bottom:0;left:0;width:520px;z-index:8;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ac) 30%,transparent),transparent)}
.svg text{fill:var(--ink);font-family:inherit;font-weight:700}
.t{font-size:24px;text-anchor:middle;dominant-baseline:middle}
.ts{font-size:19px;text-anchor:middle;fill:var(--ink2)!important;font-weight:600}
.ol{fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bx{fill:color-mix(in srgb,var(--panel) 70%,transparent);stroke:var(--ac);stroke-width:3}
.ac{fill:var(--ac)}
.pin{stroke:var(--ac);stroke-width:3}
.wire{fill:none;stroke:var(--ac);stroke-width:4;stroke-dasharray:10 14;animation:dash 1s linear infinite}
.flow{fill:none;stroke:var(--ac);stroke-width:4;stroke-dasharray:14 18;stroke-linecap:round;animation:dash .8s linear infinite}
.flow.hot{stroke:var(--hv2)}
.flow.dn{animation-name:dashr}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes dashr{to{stroke-dashoffset:-64}}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.07)}}
.bit rect{fill:rgba(15,27,45,.04);stroke:var(--ac);stroke-width:3;transition:fill .3s}
.bit.on rect{fill:var(--ac);fill-opacity:.55}
.bit text{font-size:46px;text-anchor:middle}
.layer{fill:rgba(15,27,45,.04);stroke:var(--ac);stroke-width:3;animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{fill:rgba(15,27,45,.04)}15%,30%{fill:var(--ac);fill-opacity:.4}}
.fc{transition:all .3s}
.fc.hl{fill:var(--ac);fill-opacity:.55}
.nd{fill:var(--ac);transform-box:fill-box;transform-origin:center;animation:nd 2.4s ease-in-out infinite}
@keyframes nd{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
.scan{fill:var(--ac);opacity:.75;animation:scan 3s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(500px)}}
.code{font:600 36px/1.45 Consolas,'Cascadia Mono',monospace;background:var(--code);border:2px solid var(--ac);border-radius:24px;padding:36px;height:100%;color:var(--codeTx);white-space:pre}
#code::after{content:"▌";color:var(--ac);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.code .o{color:var(--ac);margin-top:26px;border-top:2px dashed rgba(15,27,45,.2);padding-top:22px;min-height:150px}
.hz{transform-origin:320px 300px;animation:roll 9s ease-in-out infinite}
@keyframes roll{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(14deg) translateY(28px)}}
.zn{opacity:.5;transition:opacity .4s}
.zn.on{opacity:1}
.lb{opacity:.5;transition:opacity .4s}
.lb.on{opacity:1}
.spin{animation:spin .5s linear infinite}
.spin.r{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.flick{transform-box:fill-box;transform-origin:center;animation:flick .22s linear infinite alternate}
@keyframes flick{from{transform:scaleX(1)}to{transform:scaleX(.12)}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px)}}
.gs,.gt,.gc{height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px}
.gs .st{position:relative;display:flex;align-items:center;gap:26px;padding:20px 26px;border-radius:22px;background:var(--panel);border:2px solid var(--line);font-size:33px;font-weight:600;line-height:1.2;color:var(--ink)}
.gs .st b{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:var(--ink);font-size:32px}
.gs .st:not(:last-child)::after{content:"";position:absolute;left:56px;top:100%;height:16px;width:3px;background:var(--ac);opacity:.6}
.gt .gh,.gt .gr{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:16px;align-items:center}
.gt .gh{font-size:26px;letter-spacing:.14em;color:var(--ink2);font-weight:700;padding:0 26px 6px}
.gt .gr{padding:20px 26px;border-radius:20px;background:var(--panel);border:2px solid var(--line);font-size:32px;font-weight:600;color:var(--ink)}
.gt .gr span:first-child{color:color-mix(in srgb,var(--ac) 70%,var(--ink));font-weight:800}
.gc{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:20px}
.gc .cd{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;border-radius:26px;background:var(--panel);border:2px solid var(--line);text-align:center}
.gc .n{font-size:58px;font-weight:800;color:color-mix(in srgb,var(--ac) 70%,var(--ink));line-height:1.05}
.gc .l{font-size:28px;color:var(--ink2);font-weight:600;line-height:1.25}
.live .st,.live .gr,.live .cd{animation:li .7s cubic-bezier(.2,.8,.2,1) var(--d) both}
.live .st,.live .gr{animation-name:rise}
.live .cd{animation-name:rise}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
.arr{animation:arr 2s ease-in-out infinite}
@keyframes arr{50%{opacity:.45}}

#menu{position:fixed;left:0;right:0;top:0;height:64px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  background:color-mix(in srgb,var(--menu) 94%,transparent);box-shadow:0 8px 24px rgba(15,27,45,.12);transform:translateY(-100%);transition:transform .35s ease;cursor:default;
  font:600 22px 'Segoe UI',system-ui,sans-serif;color:var(--ink)}
body.menu-open #menu{transform:none}
#burger{width:52px;height:52px;padding:12px 11px;border:2px solid var(--line);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
#burger span{display:block;height:4px;border-radius:2px;background:var(--ink)}
#settings{position:absolute;right:28px;top:72px;width:400px;padding:22px;border-radius:18px;background:var(--menu);box-shadow:0 20px 50px rgba(15,27,45,.18);display:none;max-height:calc(100vh - 100px);overflow:auto}
body.settings-open #settings{display:block}
#settings h3{margin:0 0 14px;font-size:22px}
#settings label{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:19px}
#settings input[type=color]{width:64px;height:44px;border:none;background:none;padding:0;cursor:pointer}
#settings .reset{margin-top:14px;width:100%}
</style>
</head>
<body>
<div id="menu">
  <span>Bilişim ve Havacılık</span>
  <button id="burger" type="button" aria-label="Ayarlar"><span></span><span></span><span></span></button>
  <div id="settings">
    <h3>Renkler</h3>
    <div id="settings-list"></div>
    <button id="reset" type="button" class="reset">Varsayılana dön</button>
  </div>
</div>
<div id="stage" data-topic="bilisim">
  <div class="bg"><i class="b1"></i><i class="b2"></i><div class="grid"></div><canvas id="bg" width="1920" height="1080"></canvas></div>
  <div id="slides"></div>
  <div id="sweep"></div>
  <div id="bar"></div>
</div>
<script src="videos.js"></script>
<script src="slides.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
<script type="module" src="bg.js"></script>
</body>
</html>
